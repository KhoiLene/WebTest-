<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Admin</title>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 20px;
    }
    table {
        width: 100%;
        margin-top: 20px;
    }
    input[type="text"], input[type="password"] {
        padding: 8px;
        margin: 5px;
    }
    button {
        padding: 8px 15px;
        margin: 5px;
        cursor: pointer;
    }
</style>
</head>

<body>

<h2>Admin Panel</h2>

<h3>Thêm user mới</h3>
<input id="newUser" placeholder="Username">
<input id="newPass" placeholder="Password">
<button onclick="addUser()">Thêm user</button>

<hr>

<h3>Reset mật khẩu</h3>
<input id="resetUser" placeholder="User cần reset">
<input id="resetPass" placeholder="Mật khẩu mới">
<button onclick="resetPassword()">Reset mật khẩu</button>

<hr>

<h3>Danh sách user</h3>

<input id="searchUser" type="text" placeholder="Tìm kiếm username...">
<button onclick="searchUsers()">Tìm kiếm</button>
<button onclick="clearSearch()">Xóa bộ lọc</button>

<table border="1" cellpadding="10" id="userTable">
    <thead>
        <tr>
            <th>Username</th>
            <th>Role</th>
            <th>Trạng thái</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody id="userList"></tbody>
</table>

<button onclick="logout()" style="margin-top: 20px;">Đăng xuất</button>

<script src="admin.js"></script>
<script>
const currentUser = JSON.parse(localStorage.getItem("currentUser"));

if(!currentUser || currentUser.role !== "admin"){
    alert("Bạn không có quyền truy cập!");
    window.location.href = "login.html";
}

// ✅ GỌI RENDER USER KHI PAGE LOAD
window.addEventListener("load", function(){
    renderUsers();
});

function logout(){
    localStorage.removeItem("currentUser");
    window.location.href = "login.html";
}

function searchUsers(){
    const keyword = document.getElementById("searchUser").value.toLowerCase();
    
    if(!keyword){
        renderUsers();
        return;
    }

    const list = document.getElementById("userList");
    list.innerHTML = "";

    let found = false;

    getUsers().forEach((user, index) => {
        if(user.username.toLowerCase().includes(keyword)){
            found = true;
            list.innerHTML += `
                <tr>
                    <td>${user.username}</td>
                    <td>${user.role}</td>
                    <td>${user.mustChangePassword ? "Chưa đổi mật khẩu" : "OK"}</td>
                    <td>
                        <button onclick="deleteUser(${index})">Xoá</button>
                    </td>
                </tr>
            `;
        }
    });

    if(!found){
        list.innerHTML = `<tr><td colspan="4" style="text-align:center;">Không tìm thấy user</td></tr>`;
    }
}

function clearSearch(){
    document.getElementById("searchUser").value = "";
    renderUsers();
}

document.getElementById("searchUser").addEventListener("keypress", function(event){
    if(event.key === "Enter"){
        searchUsers();
    }
});
</script>
</html>
