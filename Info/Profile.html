<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Profile</title>
</head>

<body>

<h2 id="name"></h2>
<button onclick="logout()">Đăng xuất</button>

<script>
const user = JSON.parse(localStorage.getItem("currentUser"));

if(!user){
  window.location.href = "login.html";
}

document.getElementById("name").innerText = "Xin chào " + user.username;

function logout(){
  localStorage.removeItem("currentUser");
  window.location.href = "login.html";
}
</script>

</body>
</html>
